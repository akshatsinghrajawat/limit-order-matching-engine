name: CI

# S7 is a hard, test-enforced invariant (docs/spec.md): every test build
# must run under ASan+UBSan. CMakeLists.txt already defaults
# ENABLE_SANITIZERS to ON, so this workflow doesn't pass any special flags
# -- it just builds and runs the suite the same way a contributor would
# locally on Linux, and fails the build on any assertion/sanitizer trip.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
  ASAN_OPTIONS: abort_on_error=1:detect_leaks=1

jobs:
  conformance:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      - name: Run conformance suite (ASan/UBSan)
        run: ctest --test-dir build --output-on-failure

      # Seeds 101-108 don't overlap the ctest seeds (1-20) or the deep job's
      # (1-100).
      - name: Long differential fuzz (ASan/UBSan)
        run: ./build/fuzz_diff 8 250000 101 32

  differential-deep:
    # Same sanitized build as above, but optimized: the full-depth
    # exhaustive pass is too slow at -O0 to run on every push.
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel --target test_basic fuzz_diff exhaustive_diff

      # Release defines NDEBUG, so this is the run that shows the checks
      # still execute with asserts compiled out.
      - name: Conformance suite (Release, ASan/UBSan)
        run: ./build/test_basic

      - name: Differential fuzz, 100 seeds x 1M ops
        run: ./build/fuzz_diff 100 1000000 1 32

      - name: Exhaustive state-space test, full depth
        run: ./build/exhaustive_diff

  mutation-check:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Mutation check
        run: bash tools/mutation_check.sh
