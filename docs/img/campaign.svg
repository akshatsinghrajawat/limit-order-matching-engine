<text x="490.0" y="428.0" font-size="11" text-anchor="middle" fill="#6b7280" font-weight="normal" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Allocation counts are exact and machine independent. Throughput is one pinned run per build in one session, and a control run in that session was disturbed, so a few percent is indicative only.</text>
